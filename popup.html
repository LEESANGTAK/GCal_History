<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 290px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: #ffffff;
            color: #3c4043;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f3f4;
            padding-bottom: 8px;
        }

        h2 {
            font-size: 16px;
            margin: 0;
            color: #1a73e8;
            font-weight: 600;
        }

        .icon-btn {
            background: none;
            border: 1px solid #dadce0;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            color: #5f6368;
            transition: all 0.2s ease;
            padding: 0;
        }

        .icon-btn:hover {
            background-color: #f1f3f4;
            color: #1a73e8;
            border-color: #1a73e8;
            transform: rotate(45deg);
        }

        .icon-btn:active {
            transform: rotate(180deg);
        }

        .icon-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .setting-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: #f8f9fa;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #e8eaed;
        }

        .setting-label {
            font-size: 12px;
            font-weight: 600;
            color: #3c4043;
            display: flex;
            justify-content: space-between;
        }

        select {
            width: 100%;
            padding: 7px 10px;
            border-radius: 6px;
            border: 1px solid #dadce0;
            background-color: #ffffff;
            font-size: 13px;
            color: #202124;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 1px #1a73e8;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #3c4043;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-item input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: #1a73e8;
            cursor: pointer;
            margin: 0;
        }

        .status-container {
            font-size: 12px;
            padding: 10px 12px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e8eaed;
        }

        .status-message {
            line-height: 1.4;
            color: #5f6368;
        }

        #progress-container {
            margin-top: 8px;
        }

        .progress-track {
            background: #e8eaed;
            border-radius: 10px;
            height: 8px;
            width: 100%;
            overflow: hidden;
        }

        #progress-bar {
            background: linear-gradient(90deg, #4285f4, #34a853);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        #progress-text {
            font-size: 11px;
            color: #70757a;
            margin-top: 4px;
            text-align: right;
            font-weight: 500;
        }

        .hint {
            font-size: 11px;
            color: #70757a;
            margin: 0;
            line-height: 1.4;
            padding: 6px 8px;
            background: #e8f0fe;
            border-radius: 6px;
            border-left: 3px solid #1a73e8;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header-row">
            <h2>G-Cal History</h2>
            <button id="refreshBtn" title="일정 수동 새로고침" data-i18n-title-en="Refresh events" class="icon-btn">🔄</button>
        </div>

        <!-- 1. 과거 일정 조회 기간 설정 -->
        <div class="setting-box">
            <div class="setting-label">
                <span data-i18n-en="Past Event Lookup Range">과거 일정 조회 기간</span>
            </div>
            <select id="rangeSelect">
                <option value="1" data-i18n-en="Past 1 month">최근 1개월</option>
                <option value="3" data-i18n-en="Past 3 months">최근 3개월</option>
                <option value="6" data-i18n-en="Past 6 months">최근 6개월</option>
                <option value="12" selected data-i18n-en="Past 1 year (Default)">최근 1년 (기본값)</option>
                <option value="24" data-i18n-en="Past 2 years">최근 2년</option>
                <option value="36" data-i18n-en="Past 3 years">최근 3년</option>
            </select>
        </div>

        <!-- 2. 자동완성 항목 세부 설정 -->
        <div class="setting-box">
            <div class="setting-label">
                <span data-i18n-en="Autocomplete Options">자동완성 적용 항목</span>
            </div>
            <div class="checkbox-group">
                <label class="checkbox-item">
                    <input type="checkbox" id="checkTime" checked>
                    <span data-i18n-en="Time & Duration">기간 및 시간 자동완성</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="checkAttendees" checked>
                    <span data-i18n-en="Attendees">참석자 자동완성</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="checkLocation" checked>
                    <span data-i18n-en="Location">위치 자동완성</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="checkDescription" checked>
                    <span data-i18n-en="Description">설명 자동완성</span>
                </label>
            </div>
        </div>

        <!-- 3. 데이터 상태 및 프로그레스바 -->
        <div class="status-container">
            <div id="status" class="status-message" data-i18n-en="Checking data status...">데이터 상태를 확인 중입니다...</div>

            <div id="progress-container" style="display: none;">
                <div class="progress-track">
                    <div id="progress-bar"></div>
                </div>
                <div id="progress-text">0 / 0 캘린더</div>
            </div>
        </div>

        <p class="hint" data-i18n-en="💡 Changes are synced in real-time as you create events or update settings.">
            💡 일정을 등록하거나 설정을 변경하면 실시간으로 반영됩니다.
        </p>
    </div>
    <script src="popup.js"></script>
</body>

</html>
